# HCF Wrapped messages. Colors with & codes.
prefix: "&8[&6Wrapped&8] &r"

no-permission: "&cYou don't have permission."
players-only: "&cOnly players can use this."
reloaded: "&aHCF Wrapped reloaded."
no-season: "&cThere is no season yet. An admin can start one with &f/wrapped season start <name>&c."
wait-for-end: "&7Your Wrapped will be ready when the map ends. Keep playing!"
no-data: "&cNo stats found for that player this season."
unknown-stat: "&cUnknown stat. Use one of: &f{stats}"
unknown-custom: "&cUnknown custom stat. Configured: &f{stats} &7(config.yml -> custom-stats)"
join-reminder: "&eThe season is over! Type &f/wrapped &eto see your recap."

help:
  - "&6&lHCF Wrapped"
  - "&e/wrapped &7- your season recap"
  - "&e/wrapped <player> &7- someone else's recap"
  - "&e/wrapped top <stat> &7- top 10 (kills, streak, pots, pearls, diamonds, playtime...)"
  - "&e/wrapped share &7- post your card on Discord"
help-admin:
  - "&c/wrapped season start <name> &7- start tracking a new map"
  - "&c/wrapped season end &7- end the map and unlock the Wrapped"
  - "&c/wrapped add <player> <stat> <amount> &7- add KOTHs, raids..."
  - "&c/wrapped recap &7- server top 3 in chat and Discord"
  - "&c/wrapped reload"

recap:
  - "&8&m-------------------------------------"
  - "&6&l  HCF WRAPPED &7- &f{player} &8({season})"
  - "&7  Your title: {title}"
  - ""
  - "&7  Kills: &f{kills}  &7Deaths: &f{deaths}  &7K/D: &f{kdr}"
  - "&7  Best kill streak: &f{streak}"
  - "&7  Favorite victim: &f{victim} &8(x{victimcount})"
  - "&7  Nemesis: &f{nemesis} &8(x{nemesiscount})"
  - "&7  Damage dealt: &f{damage}❤  &7taken: &f{taken}❤"
  - "&7  Pots thrown: &f{pots}  &7Pearls: &f{pearls}"
  - "&7  Gapples: &f{gapples}  &7God apples: &f{godapples}"
  - "&7  Diamonds mined: &f{diamonds}"
  - "&7  Playtime: &f{playtime}"
recap-custom: "&7  {name}: &f{value}"
recap-footer:
  - "&8&m-------------------------------------"
share-button: "&a&l[SHARE ON DISCORD]"
share-hover: "&7Create your Wrapped card and post it on Discord"

top-header: "&6&lTop {stat} &8({season})"
top-line: "  {rank} &f{player} &8» &f{value}"
top-empty: "&7Nobody yet."

share-working: "&7Creating your card..."
share-done: "&aYour Wrapped was posted on Discord!"
share-saved: "&aCard created! &7(No Discord webhook set, saved in plugins/HCFWrapped/cards/{player}.png)"
share-failed: "&cCould not create or post your card. Tell an admin to check the console."
share-cooldown: "&cWait &f{seconds}s &cbefore sharing again."
discord-share: "**{player}** shared their HCF Wrapped!"
discord-recap: "The map on **{server}** is over! {players} players took part. Type `/wrapped` in game to see yours."

season-started: "&aA new season started: &f{season}&a. Every kill, pot and pearl counts now!"
season-ended:
  - "&8&m-------------------------------------"
  - "&6&l  THE MAP IS OVER!"
  - "&7  Season &f{season} &7has ended."
  - "&e  Type &f/wrapped &eto see your HCF Wrapped!"
  - "&8&m-------------------------------------"
no-active-season: "&cThere is no active season."
season-status: "&7Season: &f{season} &7| State: &f{state} &7| Players: &f{players}"
season-usage: "&7Use &f/wrapped season start <name> &7or &f/wrapped season end"
state-active: "active"
state-ended: "ended"
state-none: "none"
add-usage: "&cUse: /wrapped add <player> <stat> <amount>"
added: "&aAdded &f{value} {stat} &ato &f{player}&a."
recap-server-header: "&6&lSeason recap &8({season})"
recap-server-line: "&e{stat}: {list}"

title:
  kills: "&c&lThe Executioner"
  streak: "&c&lUnstoppable"
  pots: "&d&lPot Addict"
  pearls: "&5&lPearl Master"
  gapples: "&6&lGolden Glutton"
  diamonds: "&b&lDiamond Hunter"
  damage: "&4&lHeavy Hitter"
  playtime: "&a&lNo-Life Grinder"
  immortal: "&f&lThe Immortal"
  fodder: "&8&lCannon Fodder"
  default: "&7&lThe Survivor"

# Texts on the image card (no color codes here)
card:
  header: "HCF WRAPPED"
  kills: "Kills"
  deaths: "Deaths"
  kdr: "K/D"
  streak: "Best streak"
  pots: "Pots thrown"
  pearls: "Pearls"
  gapples: "Gapples"
  diamonds: "Diamonds"
  damage: "Damage dealt"
  playtime: "Playtime"
  victim: "FAVORITE VICTIM"
  nemesis: "NEMESIS"
  ranks: "YOUR TOP PLACES"
  footer: "HCF Wrapped • /wrapped share"

# ---------- Chat (/wrapped chat) ----------
chat:
  header: "&6&lHCF WRAPPED &8» &f&l{player}"
  subtitle: "{title} &8· &7{season}"
  victim: " &a➤ &7Favorite victim: &f{player} &8(x{count})"
  nemesis: " &c➤ &7Nemesis: &f{player} &8(x{count})"
  btn-menu: "&e&l[MENU]"
  btn-menu-hover: "&7Open your Wrapped in a menu"
  btn-top: "&6&l[TOP]"
  btn-top-hover: "&7See the best players of the season"
  btn-share: "&a&l[SHARE]"
  btn-share-hover: "&7Create your card and post it on Discord"
  hint: "&8Hover over each stat to see more"

# ---------- Stat details (chat hover and menu lore) ----------
detail:
  value: "&7Your value: &f{value}"
  rank: "&7Rank: &e#{rank} &7of &f{total}"
  no-rank: "&7Rank: &8-"
  avg: "&7Server average: &f{avg} {cmp}"
  above: "&a(x{x})"
  below: "&c(x{x})"
  above-bad: "&c(x{x})"
  below-good: "&a(x{x})"
  like-avg: "&7(same)"

# ---------- Menu ----------
menu:
  title: "&8Wrapped » &0{player}"
  top-title: "&8Top » &0{stat}"
  head-name: "&6&l{player}"
  head-title: "&7Title: {title}"
  head-season: "&7Season: &f{season}"
  head-kd: "&7Kills &f{kills} &8· &7Deaths &f{deaths} &8· &7K/D &f{kdr}"
  victim: "&a&lFavorite victim"
  nemesis: "&c&lNemesis"
  duo-line: "&f{player} &8(x{count})"
  nobody: "&8Nobody yet"
  btn-top: "&6&lSee the top"
  btn-top-lore: "&7The best players of the season"
  btn-share: "&a&lShare card"
  btn-share-lore: "&7Create your card and post it on Discord"
  btn-close: "&c&lClose"
  btn-back: "&e&lBack"
  top-empty: "&8#{rank} - free"
  top-value: "&7{stat}: &f{value}"
  your-rank-name: "&e&lYour rank"
  your-rank: "&7You are &e#{rank} &7of &f{total}"
  selected: "&a✔ Showing"
  click-to-see: "&7Click to see this top"
